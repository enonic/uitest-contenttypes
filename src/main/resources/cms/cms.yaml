kind: "CMS"
mixins:
- name: "text-area"
  allowContentTypes: "com.enonic.uitest.contenttypes:double0_0"
  optional: true
- name: "text-area"
  allowContentTypes: "com.enonic.uitest.contenttypes:double0_1"
  optional: true
- name: "image-selector"
  allowContentTypes: "com.enonic.uitest.contenttypes:double0_1"
  optional: true
- name: "html-area"
  allowContentTypes: "com.enonic.uitest.contenttypes:double0_1"
  optional: true
- name: "image-selector"
  allowContentTypes: "com.enonic.uitest.contenttypes:double1_1"
  optional: true
- name: "content-selector"
  allowContentTypes: "com.enonic.uitest.contenttypes:combobox0_0"
  optional: true
- name: "menu-item"
  allowContentTypes: "com.enonic.uitest.contenttypes:article"
  optional: true
- name: "html-area"
  allowContentTypes: "portal:site"
  optional: true
form:
- type: "ImageSelector"
  name: "backgroundImage"
  label: "Background image"
  helpText: "background image"
  occurrences:
    min: 0
    max: 1
- type: "TextLine"
  name: "numPosts"
  label: "Max posts per page"
  occurrences:
    min: 0
    max: 1
- type: "ContentSelector"
  name: "postsFolder"
  label: "Posts folder"
  occurrences:
    min: 0
    max: 1
  attributes:
    relationshipType: "system:reference"
  allowContentType:
  - "base:folder"
- type: "HtmlArea"
  name: "footerText"
  label: "Footer text"
  helpText: "text for the footer"
  occurrences:
    min: 0
    max: 1
- type: "ComboBox"
  name: "commentSort"
  label: "Comments sort"
  occurrences:
    min: 0
    max: 1
  options:
  - value: "ASC"
    label: "Oldest on top"
  - value: "DESC"
    label: "Newest on top"
- type: "CheckBox"
  name: "noLogin"
  label: "Disallow login"
  occurrences:
    min: 0
    max: 1
