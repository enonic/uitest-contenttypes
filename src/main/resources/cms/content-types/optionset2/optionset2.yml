superType: "base:structured"
abstract: false
final: false
allowChildContent: true
displayName: "optionset2"
form:
- type: "OptionSet"
  name: "radioOptionSet"
  expanded: false
  label: "Single selection"
  occurrences:
    min: 1
    max: 1
  options:
  - name: "ctbText"
    label:
      text: "Text block"
      i18n: "ct.article.ctbText"
    defaultOption: false
    items:
    - type: "TextLine"
      name: "content"
      label: "Content"
      occurrences:
        min: 0
        max: 1
    - type: "OptionSet"
      name: "ctbSettings"
      expanded: false
      label: "Settings for content block"
      occurrences:
        min: 1
        max: 1
      options:
      - name: "fullWidth"
        label: "Full width"
        defaultOption: false
      - name: "sidebarImage"
        label: "Sidebar image"
        defaultOption: false
        items:
        - type: "ImageSelector"
          name: "image"
          label: "Image"
          occurrences:
            min: 1
            max: 1
          allowPath:
          - "${site}/*"
        - type: "TextLine"
          name: "caption"
          label: "Caption"
          occurrences:
            min: 0
            max: 1
      selected:
        min: 0
        max: 10
  - name: "ctbImages"
    label: "Images"
    defaultOption: false
    items:
    - type: "OptionSet"
      name: "ctbSettings"
      expanded: false
      label: "Settings for content block"
      occurrences:
        min: 1
        max: 1
      options:
      - name: "fullWidth"
        label: "Full width"
        defaultOption: false
      selected:
        min: 0
        max: 10
  selected:
    min: 1
    max: 1
