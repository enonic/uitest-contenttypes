superType: "base:structured"
abstract: false
final: false
allowChildContent: true
displayName: "Person"
form:
- type: "TextLine"
  name: "firstName"
  label: "First Name"
  occurrences:
    min: 0
    max: 1
- type: "TextLine"
  name: "lastName"
  label: "Last Name"
  occurrences:
    min: 0
    max: 1
- type: "TextLine"
  name: "city"
  label: "City"
  occurrences:
    min: 0
    max: 1
config:
  displayNameExpression: "${firstName}  ${lastName}"
  listTitleExpression: "${data.firstName} ${data.lastName} from ${data.city}"
